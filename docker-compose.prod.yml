# Production stack. Secrets (POSTGRES_PASSWORD, SECRET_KEY, RAZORPAY_*,
# GEMINI_API_KEY) must come from a real secrets manager / orchestrator
# secret store in an actual deployment — .env is shown here only as the
# mechanism docker-compose understands locally. See PRODUCTION.md.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-razorrecon}
      POSTGRES_USER: ${POSTGRES_USER:-razorrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # No host port mapping — only reachable from other containers on this
    # network. The dev compose file exposes 5432 for local psql access;
    # production should not.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-razorrecon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-razorrecon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-razorrecon}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-razorrecon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-razorrecon}
      USE_SQLITE: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set (openssl rand -hex 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set to your real frontend origin(s)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
