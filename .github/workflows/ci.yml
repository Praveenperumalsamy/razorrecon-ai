name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///:memory:
      USE_SQLITE: "true"
      APP_ENV: test
      SECRET_KEY: ci-test-secret-key-not-for-production-use-0000000000
      CORS_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Validate Alembic migrations apply cleanly
        run: |
          rm -f /tmp/ci_migration_check.db
          DATABASE_URL="sqlite:////tmp/ci_migration_check.db" alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push — build-only verification)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: razorrecon-backend:ci

      - name: Build frontend image (no push — build-only verification)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: razorrecon-frontend:ci
