# Local development stack. NOT for production use — see docker-compose.prod.yml
# for the hardened production configuration (non-root containers, no exposed
# DB port, required secrets, resource limits, healthchecked dependency order).

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: razorrecon
      POSTGRES_USER: razorrecon
      POSTGRES_PASSWORD: razorrecon123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorrecon"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql://razorrecon:razorrecon123@db:5432/razorrecon
      USE_SQLITE: "false"
      SECRET_KEY: dev-only-insecure-secret-key-do-not-use-in-production-00000
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
